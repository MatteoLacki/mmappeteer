[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmappeteer"
version = "0.1.0"
description = "SQLite-indexed, mmappet-backed NumPy caches"
readme = "README.md"
authors = [
    {name = "MatteoLacki", email = "matteo.lacki@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "mmappet>=0.1.1",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
homepage = "https://github.com/MatteoLacki/mmappeteer.git"
repository = "https://github.com/MatteoLacki/mmappeteer.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mmappet = { path = "../../mmappet", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
